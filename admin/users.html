<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการผู้ใช้</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-client.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
:root {
  --bg:#f8fafc;
  --card:#fff;
  --border:#e2e8f0;
  --text:#0f172a;
  --primary:#2563eb;
}

body{
  margin:0;
  font-family:'Prompt',sans-serif;
  background:var(--bg);
}

.container{
  max-width:1000px;
  margin:40px auto;
  background:#fff;
  padding:24px;
  border-radius:20px;
  border:1px solid var(--border);
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
}

.role-chip{
  padding:4px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:600;
}

/* 🔥 role styles */
.role-super{background:#fee2e2;color:#b91c1c;}
.role-admin{background:#dbeafe;color:#1d4ed8;}
.role-account{background:#eef2ff;color:#4338ca;}
.role-technician{background:#ecfeff;color:#0e7490;}
.role-resident{background:#f1f5f9;color:#334155;}

select{
  padding:6px;
  border-radius:8px;
}

button{
  padding:6px 10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.btn-save{background:#2563eb;color:#fff;}
.btn-save:hover{opacity:.8;}

</style>
</head>

<body>

<div class="container">
  <h2>จัดการผู้ใช้</h2>

  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>Role</th>
        <th>จัดการ</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>
</div>

<script>
async function loadUsers(){
  const { data, error } = await supabaseClient
    .from('profiles')
    .select('id, email, role');

  if(error){
    console.error(error);
    return;
  }

  const table = document.getElementById('userTable');
  table.innerHTML = '';

  data.forEach(user=>{
    const tr = document.createElement('tr');

    tr.innerHTML = `
      <td>${user.email}</td>

      <td>
        <span class="${getRoleClass(user.role)}">
          ${user.role}
        </span>
      </td>

      <td>
        ${
          user.role === 'super_admin'
          ? '<span style="color:red;font-weight:bold;">ล็อค</span>'
          : `
          <select id="role-${user.id}">
            <option value="resident" ${user.role==='resident'?'selected':''}>resident</option>
            <option value="technician" ${user.role==='technician'?'selected':''}>technician</option>
            <option value="admin" ${user.role==='admin'?'selected':''}>admin</option>
            <option value="account" ${user.role==='account'?'selected':''}>account</option>
          </select>

          <button class="btn-save" onclick="updateRole('${user.id}')">
            บันทึก
          </button>
          `
        }
      </td>
    `;

    table.appendChild(tr);
  });
}

function getRoleClass(role){
  if(role==='super_admin') return 'role-chip role-super';
  if(role==='admin') return 'role-chip role-admin';
  if(role==='account') return 'role-chip role-account';
  if(role==='technician') return 'role-chip role-technician';
  return 'role-chip role-resident';
}

async function updateRole(userId){
  const newRole = document.getElementById(`role-${userId}`).value;

  const { error } = await supabaseClient
    .from('profiles')
    .update({ role:newRole })
    .eq('id',userId);

  if(error){
    alert('อัปเดตไม่สำเร็จ');
    return;
  }

  alert('อัปเดตสำเร็จ');
  loadUsers();
}

loadUsers();
</script>

</body>
</html>
