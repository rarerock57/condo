<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resident Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/role-routes.js"></script>
  <script src="../assets/js/auth-guard.js"></script>
  <script src="../assets/js/utils.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Prompt',sans-serif;
      background:#f1f5f9;
      color:#0f172a;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:20px;
    }

    .hero{
      background:linear-gradient(135deg,#0f172a,#1d4ed8);
      color:white;
      border-radius:28px;
      padding:32px;
      margin-bottom:24px;
      box-shadow:0 15px 40px rgba(0,0,0,.15);
    }

    .hero h1{
      font-size:34px;
      margin-bottom:8px;
    }

    .hero p{
      opacity:.9;
    }

    .menu-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:18px;
      margin-bottom:24px;
    }

    .menu-card{
      background:white;
      border-radius:22px;
      padding:24px;
      text-decoration:none;
      color:#0f172a;
      transition:.2s;
      border:1px solid #e2e8f0;
      box-shadow:0 6px 18px rgba(15,23,42,.05);
    }

    .menu-card:hover{
      transform:translateY(-4px);
    }

    .menu-card i{
      font-size:42px;
      color:#2563eb;
      margin-bottom:14px;
      display:block;
    }

    .menu-card h3{
      font-size:20px;
      margin-bottom:8px;
    }

    .menu-card p{
      color:#64748b;
      font-size:14px;
      line-height:1.6;
    }

    .bill-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:18px;
    }

    .bill-card{
      background:white;
      border-radius:22px;
      padding:24px;
      border:1px solid #e2e8f0;
      box-shadow:0 6px 18px rgba(15,23,42,.05);
    }

    .bill-card h4{
      color:#64748b;
      margin-bottom:10px;
      font-size:15px;
    }

    .bill-amount{
      font-size:32px;
      font-weight:700;
      color:#0f172a;
    }

    .total-card{
      background:linear-gradient(135deg,#dc2626,#ef4444);
      color:white;
    }

    .total-card .bill-amount{
      color:white;
    }

    .top-actions{
      margin-top:20px;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn{
      border:none;
      border-radius:14px;
      padding:12px 18px;
      cursor:pointer;
      font-family:inherit;
      font-size:15px;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
      transition:.2s;
    }

    .btn-light{
      background:white;
      color:#1d4ed8;
    }

    .btn-light:hover{
      background:#e2e8f0;
    }

    .btn-danger{
      background:#dc2626;
      color:white;
    }

    .btn-danger:hover{
      background:#b91c1c;
    }

    @media(max-width:768px){
      .hero h1{
        font-size:28px;
      }
    }
  </style>
</head>

<body>

<!-- เพิ่ม div id="residentDashboard" ครอบทั้งหมดเพื่อรองรับ Auth Guard -->
<div id="residentDashboard">

  <div class="container">

    <div class="hero">
      <h1>Resident Dashboard</h1>
      <p id="residentName">กำลังโหลดข้อมูล...</p>

      <div class="top-actions">
        <a href="maintenance.html" class="btn btn-light">
          <i class='bx bx-plus-circle'></i>
          แจ้งซ่อม
        </a>

        <a href="history.html" class="btn btn-light">
          <i class='bx bx-history'></i>
          ประวัติแจ้งซ่อม
        </a>

        <button class="btn btn-danger" onclick="logout()">
          <i class='bx bx-log-out'></i>
          ออกจากระบบ
        </button>
      </div>
    </div>

    <div class="bill-grid">

      <div class="bill-card">
        <h4>ค่าน้ำ</h4>
        <div class="bill-amount" id="waterBill">0 ฿</div>
      </div>

      <div class="bill-card">
        <h4>ค่าส่วนกลาง</h4>
        <div class="bill-amount" id="commonBill">0 ฿</div>
      </div>

      <div class="bill-card">
        <h4>ค่าจอดรถ</h4>
        <div class="bill-amount" id="parkingBill">0 ฿</div>
      </div>

      <div class="bill-card total-card">
        <h4>ยอดรวมค้างชำระ</h4>
        <div class="bill-amount" id="totalBill">0 ฿</div>
      </div>

    </div>

  </div>

</div> <!-- ปิด div residentDashboard ตรงนี้ -->

<script>

let currentProfile = null;

async function logout(){
  await supabaseClient.auth.signOut();
  location.href = '../auth/login.html';
}

async function loadBills(profile){

  const roomId = profile.room_id;

  const { data, error } = await supabaseClient
    .from('monthly_bills')
    .select('*')
    .eq('room_id', roomId)
    .order('created_at',{ ascending:false })
    .limit(1)
    .single();

  if(error || !data){
    console.log(error);
    return;
  }

  const water = Number(data.water_bill || 0);
  const common = Number(data.common_fee || 0);
  const parking = Number(data.parking_fee || 0);

  const total = water + common + parking;

  document.getElementById('waterBill').innerText =
    water.toLocaleString('th-TH') + ' ฿';

  document.getElementById('commonBill').innerText =
    common.toLocaleString('th-TH') + ' ฿';

  document.getElementById('parkingBill').innerText =
    parking.toLocaleString('th-TH') + ' ฿';

  document.getElementById('totalBill').innerText =
    total.toLocaleString('th-TH') + ' ฿';
}

window.initRoleGuard({
  appId:'residentDashboard',
  allowedRoles:['resident'],

  onReady: async(profile,user)=>{

    currentProfile = profile;

    document.getElementById('residentName').innerText =
      `${profile.full_name || '-'} | ห้อง ${profile.room_number || '-'}`;

    await loadBills(profile);
  }
});

</script>

</body>
</html>
