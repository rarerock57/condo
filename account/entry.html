<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบบันทึกข้อมูลใบเสร็จ</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Prompt', sans-serif;
  margin:0;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:30px;
}

.card {
  background:#1e293b;
  border-radius:20px;
  padding:25px;
  box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

h1 {
  color:#facc15;
}

.section {
  margin-top:25px;
}

.section-title {
  border-left:4px solid #facc15;
  padding-left:10px;
  margin-bottom:10px;
  font-weight:600;
}

.helper {
  font-size:13px;
  color:#94a3b8;
  margin-bottom:10px;
}

input, select {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #334155;
  background:#0f172a;
  color:#fff;
}

input:focus {
  outline:none;
  border-color:#facc15;
}

.grid {
  display:grid;
  gap:10px;
}

.grid-3 { grid-template-columns:repeat(3,1fr); }
.grid-2 { grid-template-columns:repeat(2,1fr); }

.btn {
  background:#facc15;
  color:#000;
  padding:14px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
}

.btn:hover {
  background:#eab308;
}

.total {
  font-size:28px;
  font-weight:bold;
  color:#22c55e;
  text-align:center;
}

.toast {
  position:fixed;
  bottom:20px;
  right:20px;
  background:#22c55e;
  padding:15px 20px;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>💰 ระบบบันทึกข้อมูลใบเสร็จ</h1>

<div class="helper">
ค่าส่วนกลาง × 25 บาท / ค่าน้ำ × 18 บาท / รถยนต์ 500 / มอไซค์ 100
</div>

<div class="card">

<!-- ROOM -->
<div class="section">
<div class="section-title">ข้อมูลห้อง</div>
<div class="grid grid-2">
<input id="room" placeholder="เช่น 6316">
<input placeholder="ชื่อผู้เช่า">
</div>
</div>

<!-- ส่วนกลาง -->
<div class="section">
<div class="section-title">1. ค่าส่วนกลาง</div>
<div class="helper">พื้นที่ × 25 × จำนวนเดือน</div>

<div class="grid grid-3">
<input id="area" placeholder="ตรม. เช่น 35">
<input id="months" placeholder="จำนวนเดือน เช่น 1">
<input id="common" placeholder="ค่าส่วนกลาง" readonly>
</div>
</div>

<!-- ค่าน้ำ -->
<div class="section">
<div class="section-title">2. ค่าน้ำ</div>
<div class="helper">เลขมิเตอร์ปัจจุบัน - ก่อนหน้า × 18</div>

<div class="grid grid-3">
<input id="waterPrev" placeholder="เลขก่อนหน้า">
<input id="waterNow" placeholder="เลขปัจจุบัน">
<input id="waterTotal" placeholder="รวมค่าน้ำ" readonly>
</div>
</div>

<!-- ค่าอื่น -->
<div class="section">
<div class="section-title">3. ค่าใช้จ่ายอื่น</div>

<div class="grid grid-3">
<input id="car" placeholder="รถยนต์ (คัน)">
<input id="bike" placeholder="มอไซค์ (คัน)">
<input id="trash" placeholder="ค่าขยะ" value="40">
</div>
</div>

<!-- TOTAL -->
<div class="section">
<div class="section-title">ยอดรวม</div>
<div class="total" id="grandTotal">0 บาท</div>
</div>

<button class="btn" onclick="submitForm()">บันทึกข้อมูล</button>

</div>

</div>

<div class="toast" id="toast">บันทึกสำเร็จ</div>

<script>

// ===== CALC =====
function calculate() {
  const area = +document.getElementById('area').value || 0;
  const months = +document.getElementById('months').value || 0;
  const waterPrev = +document.getElementById('waterPrev').value || 0;
  const waterNow = +document.getElementById('waterNow').value || 0;
  const car = +document.getElementById('car').value || 0;
  const bike = +document.getElementById('bike').value || 0;
  const trash = +document.getElementById('trash').value || 0;

  const common = area * 25 * months;
  const water = (waterNow - waterPrev) * 18;
  const parking = (car * 500) + (bike * 100);

  document.getElementById('common').value = common;
  document.getElementById('waterTotal').value = water;

  const total = common + water + parking + trash;
  document.getElementById('grandTotal').innerText = total.toLocaleString() + " บาท";
}

// auto calculate
document.querySelectorAll('input').forEach(el => {
  el.addEventListener('input', calculate);
});

// submit
function submitForm() {
  showToast();
}

// toast
function showToast() {
  const t = document.getElementById('toast');
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

</script>

</body>
</html>
