<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHAROEN KRUNG CONDOMINIUM 3</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

  <style>
    body { font-family: 'Prompt', sans-serif; }
    html { scroll-behavior: smooth; }

    .hero-bg {
      background-image:
        linear-gradient(135deg, rgba(8, 23, 57, 0.78), rgba(17, 24, 39, 0.55)),
        url('https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?q=80&w=1600&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800">

<!-- NAV -->
<nav class="bg-white shadow fixed w-full z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <img src="https://fjvcqxqchluvmxnlvhwo.supabase.co/storage/v1/object/public/assets/logo.png" class="h-14">

    <a
      href="auth/login.html"
      onclick="return checkConsentBeforeLogin(event)"
      class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl flex items-center gap-2"
    >
      <i class='bx bx-user'></i> ระบบลูกบ้าน
    </a>
  </div>
</nav>

<!-- HERO -->
<section class="hero-bg pt-32 pb-24 text-white text-center">
  <h1 class="text-4xl font-bold mb-4">
    ยินดีต้อนรับสู่<br>เจริญกรุง คอนโดมิเนียม 3
  </h1>
  <p class="text-lg text-slate-200">
    ระบบข่าวสารและบริการสำหรับลูกบ้าน
  </p>
</section>

<!-- COOKIE BANNER -->
<div id="cookieBanner" style="
position: fixed;
bottom: 0;
left: 0;
right: 0;
background: #0f766e;
color: white;
padding: 16px;
display: none;
z-index: 999;
">

  <div style="max-width:1200px;margin:auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;">
    <div>
      เว็บไซต์นี้ใช้คุกกี้เพื่อปรับปรุงการใช้งาน
      <a href="privacy-policy.html" style="text-decoration:underline;color:#fff;">อ่านนโยบาย</a>
    </div>

    <div>
      <button onclick="acceptCookies()" style="margin-right:10px;">ยอมรับ</button>
      <button onclick="goToPrivacyPolicy()">อ่านนโยบาย</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="policyWarningModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[9999] p-4">
  <div class="bg-white rounded-3xl p-6 max-w-md w-full text-center shadow-2xl">
    <h3 class="text-xl font-bold mb-3">กรุณายอมรับนโยบายก่อนใช้งาน</h3>
    <p class="text-slate-500 mb-5">
      กรุณาอ่านและยอมรับนโยบายความเป็นส่วนตัวก่อนเข้าสู่ระบบ
    </p>

    <div class="flex gap-3">
      <button onclick="closePolicyWarningModal()" class="flex-1 bg-gray-200 rounded-xl py-2">
        ปิด
      </button>

      <a href="privacy-policy.html" class="flex-1 bg-blue-600 text-white rounded-xl py-2">
        อ่านนโยบาย
      </a>
    </div>
  </div>
</div>

<script>
function acceptCookies() {
  localStorage.setItem("cookie_consent", "accepted");
  document.getElementById("cookieBanner").style.display = "none";
  closePolicyWarningModal();
}

function goToPrivacyPolicy() {
  window.location.href = "privacy-policy.html";
}

function hasAcceptedCookies() {
  return localStorage.getItem("cookie_consent") === "accepted";
}

function openPolicyWarningModal() {
  const modal = document.getElementById("policyWarningModal");
  modal.classList.remove("hidden");
  modal.classList.add("flex");
}

function closePolicyWarningModal() {
  const modal = document.getElementById("policyWarningModal");
  modal.classList.add("hidden");
  modal.classList.remove("flex");
}

function checkConsentBeforeLogin(event) {
  if (hasAcceptedCookies()) return true;

  event.preventDefault();
  document.getElementById("cookieBanner").style.display = "block";
  openPolicyWarningModal();
  return false;
}

if (!hasAcceptedCookies()) {
  document.getElementById("cookieBanner").style.display = "block";
}
</script>

</body>
</html>
